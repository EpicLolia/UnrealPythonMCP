<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unreal Python MCP Workbench</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #1e1e2e;
        --bg-surface: #181825;
        --bg-deep: #11111b;
        --border: #313244;
        --border-hover: #45475a;
        --text: #cdd6f4;
        --text-dim: #9399b2;
        --text-faint: #7f849c;
        --accent: #89b4fa;
        --green: #a6e3a1;
        --red: #f38ba8;
        --yellow: #f9e2af;
        --mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Header */
      header {
        padding: 10px 20px;
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }
      header h1 {
        font-size: 15px;
        font-weight: 600;
        color: var(--accent);
      }
      header .status {
        font-size: 12px;
        color: var(--text-dim);
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* Three-column layout */
      .main-layout {
        flex: 1;
        display: grid;
        grid-template-columns: 2fr 1fr 3fr;
        overflow: hidden;
      }
      .main-layout.config-hidden {
        grid-template-columns: 1fr 3fr;
      }

      /* Panels */
      .panel-config {
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .panel-config.collapsed {
        display: none;
      }
      .panel-left {
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .panel-header {
        padding: 8px 12px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-surface);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .toggle-btn {
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 14px;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 3px;
        line-height: 1;
      }
      .toggle-btn:hover {
        background: var(--border);
        color: var(--text);
      }
      .toggle-btn.active {
        background: var(--accent);
        color: var(--bg);
      }

      /* History list */
      .history-list {
        flex: 1;
        overflow-y: auto;
        padding: 6px;
      }
      .history-item {
        padding: 8px 10px;
        border-radius: 4px;
        cursor: pointer;
        margin-bottom: 2px;
        border: 1px solid transparent;
        transition: background 0.1s;
      }
      .history-item:hover {
        background: var(--bg-surface);
      }
      .history-item.active {
        background: var(--bg-surface);
        border-color: var(--accent);
      }
      .history-item.duplicate {
        padding: 4px 10px 4px 18px;
        margin-bottom: 0;
        border-left: 2px solid var(--border);
        border-radius: 0 4px 4px 0;
        margin-left: 6px;
      }
      .history-item-header {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .history-item-id {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-dim);
      }
      .history-item-meta {
        font-size: 10px;
        color: var(--text-faint);
        margin-left: auto;
      }

      /* Badges */
      .badge {
        padding: 1px 5px;
        border-radius: 3px;
        font-size: 10px;
        font-weight: 600;
        color: var(--bg);
      }
      .badge-ok {
        background: var(--green);
      }
      .badge-err {
        background: var(--red);
      }

      /* Center panel */
      .panel-center {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .editor-wrapper {
        flex: 3;
        display: flex;
        flex-direction: column;
        padding: 16px;
        min-height: 0;
        position: relative;
      }
      .editor-wrapper textarea {
        flex: 1;
        width: 100%;
        background: var(--bg-deep);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 14px;
        padding-bottom: 50px;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.6;
        resize: none;
        outline: none;
        tab-size: 4;
        transition: border-color 0.2s;
      }
      .editor-wrapper textarea:focus {
        border-color: var(--accent);
      }
      .editor-wrapper textarea.running {
        border-color: var(--yellow);
        animation: running-pulse 1.5s ease-in-out infinite;
      }
      @keyframes running-pulse {
        0%,
        100% {
          border-color: var(--yellow);
        }
        50% {
          border-color: var(--border);
        }
      }
      .editor-toolbar {
        position: absolute;
        bottom: 28px;
        right: 28px;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      /* Output */
      .output-wrapper {
        flex: 2;
        display: flex;
        flex-direction: column;
        padding: 0 16px 16px 16px;
        min-height: 0;
      }
      .output-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
        flex-shrink: 0;
      }
      .output-content {
        flex: 1;
        background: var(--bg-deep);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 14px;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.5;
        white-space: pre;
        overflow: auto;
        color: var(--text);
      }
      .output-content.placeholder {
        color: var(--text-faint);
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: normal;
      }
      .output-content.error {
        border-color: var(--red);
      }
      .output-content.success {
        border-color: var(--green);
      }

      /* Config */
      .config-list {
        flex: 1;
        overflow-y: auto;
        padding: 6px;
      }
      .config-item {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 10px;
        margin-bottom: 6px;
      }
      .config-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 8px;
      }
      .config-key {
        font-weight: 600;
        font-size: 12px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .config-input {
        width: 100%;
        padding: 5px 8px;
        background: var(--bg-deep);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        outline: none;
        transition: border-color 0.15s;
      }
      .config-input:focus {
        border-color: var(--accent);
      }
      .config-input:disabled {
        color: var(--text);
        cursor: default;
        border-color: transparent;
        background: transparent;
      }
      .config-input.saved {
        border-color: var(--green);
      }
      .config-desc {
        font-size: 10px;
        color: var(--text-faint);
        margin-top: 4px;
      }

      /* Buttons */
      button {
        padding: 6px 14px;
        border: none;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.1s;
      }
      button:hover {
        opacity: 0.85;
      }
      button:active {
        opacity: 0.7;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-run {
        background: var(--accent);
        color: var(--bg);
        padding: 8px 20px;
        border-radius: 6px;
        font-weight: 600;
      }
      .btn-clear {
        background: var(--border);
        color: var(--text-dim);
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 12px;
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 40px 16px;
        color: var(--text-faint);
        font-size: 13px;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--border-hover);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-actions">
        <button class="toggle-btn" id="toggle-config-btn" onclick="toggleConfig()" title="Toggle Config panel">&#9776;</button>
        <h1>Unreal Python MCP Workbench</h1>
      </div>
      <span class="status" id="status">Ready</span>
    </header>

    <div class="main-layout config-hidden">
      <div class="panel-config collapsed" id="panel-config">
        <div class="panel-header">Config</div>
        <div class="config-list" id="config-list"></div>
      </div>

      <div class="panel-left">
        <div class="panel-header">History</div>
        <div class="history-list" id="history-list">
          <div class="empty-state">No commands yet</div>
        </div>
      </div>

      <div class="panel-center">
        <div class="editor-wrapper">
          <textarea id="editor" placeholder="Enter Python code...&#10;&#10;Ctrl+Enter to run" spellcheck="false" wrap="off"></textarea>
          <div class="editor-toolbar">
            <button class="btn-clear" onclick="clearEditor()">Clear</button>
            <button class="btn-run" id="runBtn" onclick="runCode()">Run</button>
          </div>
        </div>
        <div class="output-wrapper">
          <div class="output-label">Output</div>
          <div class="output-content placeholder" id="output">Run code to see output</div>
        </div>
      </div>
    </div>

    <script>
      const editor = document.getElementById('editor');
      const output = document.getElementById('output');
      const historyList = document.getElementById('history-list');
      const statusEl = document.getElementById('status');
      const runBtn = document.getElementById('runBtn');

      // Store history records for safe lookup (avoids XSS from inline JSON)
      let historyRecords = [];
      let activeHistoryId = null;

      editor.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          e.preventDefault();
          const s = editor.selectionStart,
            end = editor.selectionEnd;
          editor.value = editor.value.substring(0, s) + '    ' + editor.value.substring(end);
          editor.selectionStart = editor.selectionEnd = s + 4;
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          runCode();
        }
      });

      async function runCode() {
        const code = editor.value.trim();
        if (!code) return;

        runBtn.disabled = true;
        editor.classList.add('running');
        statusEl.textContent = 'Running...';
        output.className = 'output-content placeholder';
        output.textContent = 'Executing...';

        try {
          const res = await fetch('/api/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code }),
          });
          const data = await res.json();
          output.textContent = data.output || '(no output)';
          output.className = 'output-content ' + (data.success ? 'success' : 'error');
          statusEl.textContent = data.success ? 'Done' : 'Error';
          refreshHistory();
        } catch (err) {
          output.textContent = 'Request failed: ' + err.message;
          output.className = 'output-content error';
          statusEl.textContent = 'Error';
        } finally {
          runBtn.disabled = false;
          editor.classList.remove('running');
        }
      }

      function clearEditor() {
        editor.value = '';
        editor.focus();
      }

      function selectHistoryItem(id) {
        const record = historyRecords.find((r) => r.id === id);
        if (!record) return;
        activeHistoryId = id;
        editor.value = record.code;
        output.textContent = record.output || '(no output)';
        output.className = 'output-content ' + (record.success ? 'success' : 'error');
        document.querySelectorAll('.history-item').forEach((el) => el.classList.remove('active'));
        const el = document.getElementById('hist-' + id);
        if (el) el.classList.add('active');
      }

      function escapeHtml(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
      }

      function formatTime(iso) {
        return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      async function refreshHistory() {
        try {
          const res = await fetch('/api/history');
          historyRecords = await res.json();
          renderHistory();
        } catch (e) {
          /* silent */
        }
      }

      function renderHistory() {
        if (historyRecords.length === 0) {
          historyList.innerHTML = '<div class="empty-state">No commands yet</div>';
          return;
        }
        const sorted = [...historyRecords].reverse();
        historyList.innerHTML = sorted
          .map((r, i) => {
            const prev = sorted[i - 1];
            const isDuplicate = prev && prev.code === r.code;
            const badge = r.success ? '<span class="badge badge-ok">OK</span>' : '<span class="badge badge-err">ERR</span>';
            const active = r.id === activeHistoryId ? ' active' : '';
            const dupClass = isDuplicate ? ' duplicate' : '';
            const meta = formatTime(r.timestamp) + (r.duration != null ? ' \xb7 ' + r.duration + 'ms' : '');
            return `<div class="history-item${active}${dupClass}" id="hist-${r.id}" onclick="selectHistoryItem(${r.id})" tabindex="0" role="button">
  <div class="history-item-header">
    <span class="history-item-id">#${r.id}</span>
    ${badge}
    <span class="history-item-meta">${meta}</span>
  </div>
</div>`;
          })
          .join('');
      }

      // Config
      function toggleConfig() {
        const panel = document.getElementById('panel-config');
        const layout = document.querySelector('.main-layout');
        const btn = document.getElementById('toggle-config-btn');
        panel.classList.toggle('collapsed');
        layout.classList.toggle('config-hidden');
        btn.classList.toggle('active');
        if (!panel.classList.contains('collapsed')) {
          refreshConfig();
        }
      }

      async function refreshConfig() {
        try {
          const res = await fetch('/api/config');
          renderConfig(await res.json());
        } catch (e) {
          /* silent */
        }
      }

      function renderConfig(items) {
        const list = document.getElementById('config-list');
        list.innerHTML = items
          .map((item) => {
            const placeholder = item.mutable ? String(item.defaultValue) : '';
            return `<div class="config-item">
  <div class="config-row">
    <span class="config-key">${escapeHtml(item.key)}</span>
    <input class="config-input" id="cfg-${item.key}"
      value="${escapeHtml(String(item.value))}"
      placeholder="${escapeHtml(placeholder)}" 
      ${item.mutable ? 'data-mutable="1"' : 'disabled'} />
  </div>
  <div class="config-desc">${escapeHtml(item.description)}</div>
</div>`;
          })
          .join('');

        // Attach auto-save on blur or Enter for mutable inputs
        list.querySelectorAll('input[data-mutable]').forEach((input) => {
          input.addEventListener('blur', () => {
            const key = input.id.replace('cfg-', '');
            saveConfig(key, input);
          });
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              input.blur();
            }
          });
        });
      }

      async function saveConfig(key, input) {
        try {
          const res = await fetch('/api/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key, value: input.value }),
          });
          const data = await res.json();
          if (data.error) {
            statusEl.textContent = 'Error: ' + data.error;
            setTimeout(() => {
              statusEl.textContent = 'Ready';
            }, 3000);
          } else {
            input.classList.add('saved');
            setTimeout(() => {
              input.classList.remove('saved');
            }, 1500);
          }
        } catch (err) {
          statusEl.textContent = 'Error: ' + err.message;
          setTimeout(() => {
            statusEl.textContent = 'Ready';
          }, 3000);
        }
      }

      // Polling with visibility check
      let pollTimer = null;
      function startPolling() {
        pollTimer = setInterval(() => {
          if (!document.hidden) refreshHistory();
        }, 3000);
      }
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) refreshHistory();
      });

      // Keyboard support for history items
      historyList.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          const item = e.target.closest('.history-item');
          if (item) {
            e.preventDefault();
            item.click();
          }
        }
      });

      // Init
      refreshHistory();
      startPolling();
    </script>
  </body>
</html>
